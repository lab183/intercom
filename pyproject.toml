[project]
name = "intercom"
version = "0.1.0"
description = "Text-to-speech CLI and MCP server built on Pocket TTS (Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "pocket-tts>=3.3.0",
    "scipy>=1.18.1",
]

[project.scripts]
intercom = "main:main"
intercom-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "mcp_server"]
